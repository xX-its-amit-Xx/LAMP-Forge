[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamp-forge"
version = "0.1.0"
description = "Reproducible LAMP primer design pipeline for microbial diagnostics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "LAMP-Forge contributors" }
]
keywords = ["bioinformatics", "lamp", "primer-design", "diagnostics", "microbiology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.83",
    "primer3-py>=2.0.3",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "snakemake>=8.0",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-PyYAML",
    "types-requests",
    "ipykernel",
    "jupyter",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "arq>=0.25",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.scripts]
lamp-forge = "lamp_forge.cli:cli"
lamp-forge-web = "lamp_forge.web.__main__:main"
lamp-forge-worker = "lamp_forge.web.worker:main"

[project.urls]
Homepage = "https://github.com/lamp-forge/lamp-forge"
Documentation = "https://github.com/lamp-forge/lamp-forge/blob/main/README.md"
Issues = "https://github.com/lamp-forge/lamp-forge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lamp_forge = [
    "templates/*.html",
    "templates/*.css",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=lamp_forge",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: tests that require network access",
    "web: web/API tests (require web extras installed)",
]

[tool.coverage.run]
branch = true
source = ["lamp_forge"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "D",        # pydocstyle
]
ignore = [
    "D100", "D104", "D107",  # missing docstrings in module/package/init
    "D203", "D213",          # conflicting docstring rules
    "E501",                  # line too long (handled by formatter)
    "B008",                  # FastAPI `Depends()` in defaults is the canonical pattern
    "RUF001", "RUF002", "RUF003",  # × and Δ are intentional scientific notation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D"]
# Click's `\b` no-wrap marker in --help docstrings needs backspace
# interpretation, which only works in non-raw strings.
"src/lamp_forge/cli.py" = ["D301"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
# Biopython and primer3 ship without complete type info — strict mode would
# otherwise flag every call into them as a no-untyped-call error.
untyped_calls_exclude = ["Bio", "primer3"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "click>=8.4.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
]
