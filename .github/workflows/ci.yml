name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: mypy
        run: mypy src/lamp_forge

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (MAFFT, BLAST+)
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft ncbi-blast+

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run pytest
        env:
          NCBI_EMAIL: ci@lamp-forge.dev
        run: pytest -m "not network" --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cli, web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: lamp-forge:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke-test CLI image
        if: matrix.target == 'cli'
        run: |
          docker run --rm lamp-forge:cli --version
          docker run --rm lamp-forge:cli --help

  integration:
    name: Integration test (web + worker + redis)
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build web worker
      - name: Start stack
        run: |
          docker compose up -d redis web worker
          # Wait for readiness.
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v1/health; then break; fi
            sleep 2
          done
      - name: Smoke-test API
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/api/openapi.json | head -c 200
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
