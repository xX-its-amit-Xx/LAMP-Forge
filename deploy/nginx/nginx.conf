# LAMP-Forge nginx reverse proxy.
#
# Strategy:
# - Plain HTTP on :80 redirects to HTTPS (unless ENV=development).
# - HTTPS on :443 terminates TLS and proxies to the FastAPI app.
# - Long timeouts on /api/v1/jobs (file uploads, slow Entrez calls).
# - Real-IP propagation so the FastAPI rate limiter sees the client, not nginx.
#
# To enable TLS: drop a fullchain.pem + privkey.pem into deploy/nginx/certs/
# and uncomment the "ssl" blocks. Self-signed certs for local testing are
# fine; for production, use Let's Encrypt + cert-manager or a similar tool.

upstream lamp_forge_web {
    # Resolves to the FastAPI container; docker DNS handles load balancing
    # across replicas if you scale --scale web=N.
    server web:8000;
    keepalive 32;
}

# Rate-limit zones — these are nginx-level and complementary to the
# slowapi-based per-API-key limits in the app. nginx catches floods that
# would otherwise tie up FastAPI workers.
limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name _;

    # Health/ready endpoints stay on plain HTTP so load balancers can probe.
    location ~ ^/api/v1/(health|ready)$ {
        proxy_pass http://lamp_forge_web;
        access_log off;
    }

    # Redirect everything else to HTTPS in production. Comment this block
    # out for local dev where you don't have certs.
    location / {
        # In dev (no certs), the conditional below makes nginx serve over
        # plain HTTP. Set NGINX_FORCE_HTTPS=1 in your environment to disable.
        proxy_pass http://lamp_forge_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        limit_req zone=public burst=40 nodelay;
        client_max_body_size 64m;

        # Long-running endpoints need generous timeouts.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Upload endpoint: tight rate-limit + larger body cap.
    location = /api/v1/uploads {
        proxy_pass http://lamp_forge_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=uploads burst=10 nodelay;
        client_max_body_size 64m;
        proxy_request_buffering off;
    }
}

